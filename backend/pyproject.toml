[project]
name = "backend"
version = "0.1.0"
description = "STEM SPARK agent pipeline API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# Used by `fastapi dev`, `fastapi run` and `fastapi deploy` (FastAPI Cloud).
[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
